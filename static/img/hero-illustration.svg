<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 450" fill="none">
  <!-- Background circle -->
  <circle cx="250" cy="225" r="200" fill="#f3e8ff" opacity="0.5"/>
  <circle cx="250" cy="225" r="150" fill="#ede9fe" opacity="0.6"/>

  <!-- Shield body -->
  <path d="M250 60 L370 120 L370 250 C370 330 310 390 250 410 C190 390 130 330 130 250 L130 120 Z"
        fill="url(#shieldGrad)" stroke="#6d28d9" stroke-width="3"/>

  <!-- Shield inner highlight -->
  <path d="M250 85 L350 135 L350 248 C350 318 298 370 250 388 C202 370 150 318 150 248 L150 135 Z"
        fill="url(#innerGrad)" opacity="0.6"/>

  <!-- Lock body -->
  <rect x="218" y="220" width="64" height="55" rx="8" fill="#7c3aed"/>
  <!-- Lock shackle -->
  <path d="M230 220 L230 195 C230 175 270 175 270 195 L270 220"
        stroke="#7c3aed" stroke-width="8" fill="none" stroke-linecap="round"/>
  <!-- Keyhole -->
  <circle cx="250" cy="242" r="8" fill="#f3e8ff"/>
  <rect x="247" y="248" width="6" height="14" rx="2" fill="#f3e8ff"/>

  <!-- Checkmark (top-right) -->
  <circle cx="360" cy="100" r="28" fill="#10b981" opacity="0.9"/>
  <path d="M345 100 L355 110 L377 88" stroke="white" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Scanning lines (left side) -->
  <g opacity="0.5">
    <line x1="80" y1="160" x2="120" y2="160" stroke="#a78bfa" stroke-width="3" stroke-linecap="round"/>
    <line x1="70" y1="180" x2="120" y2="180" stroke="#a78bfa" stroke-width="3" stroke-linecap="round"/>
    <line x1="75" y1="200" x2="120" y2="200" stroke="#a78bfa" stroke-width="3" stroke-linecap="round"/>
    <line x1="80" y1="220" x2="120" y2="220" stroke="#a78bfa" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Code brackets (right side) -->
  <g opacity="0.5">
    <text x="385" y="200" font-family="monospace" font-size="28" fill="#a78bfa">&lt;/&gt;</text>
  </g>

  <!-- Floating dots decoration -->
  <circle cx="100" cy="300" r="6" fill="#c4b5fd" opacity="0.6"/>
  <circle cx="400" cy="310" r="8" fill="#c4b5fd" opacity="0.5"/>
  <circle cx="380" cy="160" r="5" fill="#ddd6fe" opacity="0.7"/>
  <circle cx="120" cy="120" r="7" fill="#ddd6fe" opacity="0.5"/>
  <circle cx="160" cy="370" r="5" fill="#c4b5fd" opacity="0.6"/>
  <circle cx="340" cy="380" r="6" fill="#ddd6fe" opacity="0.5"/>

  <!-- Wi-Fi / signal arcs (top-left) -->
  <g transform="translate(140, 100)" opacity="0.4">
    <path d="M-15 0 A20 20 0 0 1 15 0" stroke="#8b5cf6" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M-25 -8 A30 30 0 0 1 25 -8" stroke="#8b5cf6" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M-35 -16 A42 42 0 0 1 35 -16" stroke="#8b5cf6" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Score bar (bottom) -->
  <rect x="175" y="330" width="150" height="12" rx="6" fill="#e9d5ff"/>
  <rect x="175" y="330" width="110" height="12" rx="6" fill="url(#barGrad)"/>
  <text x="250" y="362" font-family="sans-serif" font-size="13" fill="#6d28d9" text-anchor="middle" font-weight="bold">Score: 85/100</text>

  <!-- Gradients -->
  <defs>
    <linearGradient id="shieldGrad" x1="130" y1="60" x2="370" y2="410">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="innerGrad" x1="150" y1="85" x2="350" y2="388">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="175" y1="0" x2="285" y2="0">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
</svg>
